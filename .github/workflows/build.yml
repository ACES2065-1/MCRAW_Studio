name: build

# Two tiers:
#
#   windows-core      — fast smoke build of the decoder + example (no vcpkg).
#                       Catches container-parsing / RawData / Trimmer breakage
#                       in a couple of minutes.
#
#   windows-pipeline  — full render pipeline build. Builds mcraw_render +
#                       the mcraw Python module against a CI-only vcpkg
#                       manifest (.github/vcpkg/vcpkg.json), CPU-only.
#                       No footage is committed to the repo, so render
#                       regressions are run locally: test/smoke.py and
#                       test/player_preview_verify.py take any .mcraw clip.
#
# The first pipeline run compiles FFmpeg/x265/OpenEXR/OCIO from source
# (~60-90 min). vcpkg's binary cache is persisted via actions/cache, so
# subsequent runs restore prebuilt archives and finish in ~10 min.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    name: Windows / core build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (decoder + example only)
        # MCRAW_BUILD_RENDER=OFF disables the OpenEXR / OCIO / FFmpeg path;
        # MCRAW_BUILD_PYTHON=OFF disables pybind11. Both rely on vcpkg.
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DMCRAW_BUILD_RENDER=OFF `
            -DMCRAW_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke-check the example binary
        # Running it with no args should exit non-zero with a usage message,
        # not crash. Confirms the binary actually links and starts.
        run: |
          if (Test-Path build/Release/example.exe) {
            $exe = "build/Release/example.exe"
          } else {
            $exe = "build/example.exe"
          }
          Write-Host "Probing $exe"
          & $exe 2>&1 | Out-String | Write-Host
          # Treat any exit code as a pass — we only care that it didn't crash.
          exit 0

  windows-pipeline:
    name: Windows / full pipeline build
    runs-on: windows-latest
    timeout-minutes: 150

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip pybind11

      - name: Prepare vcpkg binary cache dir
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('.github/vcpkg/vcpkg.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Configure (full render pipeline, CPU-only)
        # Uses the runner's preinstalled vcpkg in manifest mode, pointed at
        # the CI-only manifest so local classic-mode builds stay untouched.
        # CUDA is off — runners have no NVIDIA toolkit or GPU.
        run: |
          $py = (Get-Command python).Source
          $pybind11_dir = (python -m pybind11 --cmakedir)
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="$PWD\.github\vcpkg" `
            -DMCRAW_ENABLE_CUDA=OFF `
            -DPython_EXECUTABLE="$py" `
            -DPython_ROOT_DIR="$env:pythonLocation" `
            -Dpybind11_DIR="$pybind11_dir"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify build artifacts
        run: |
          if (Test-Path build\Release\mcraw_render.exe) {
            $render_exe = "build\Release\mcraw_render.exe"
          } else {
            $render_exe = "build\mcraw_render.exe"
          }
          Write-Host "Probing $render_exe"
          & $render_exe --help

          $dll_dir = "$PWD\build\vcpkg_installed\x64-windows\bin"
          $build_dir = if (Test-Path build\Release\mcraw*.pyd) { "$PWD\build\Release" } else { "$PWD\build" }
          python -c @"
          import os, sys
          if os.path.isdir(r'$dll_dir'):
              os.add_dll_directory(r'$dll_dir')
          sys.path.insert(0, r'$build_dir')
          import mcraw
          print('Successfully imported mcraw module:', mcraw)
          "@
